<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <!-- Sample "after" image. Differs from before.svg in exactly four places;
       see the comments below. Everything else is byte-identical, so the diff
       view should highlight only these four regions. -->
  <rect width="800" height="500" fill="#1e2733"/>

  <g stroke="#2a3440" stroke-width="1">
    <path d="M0 125h800M0 250h800M0 375h800"/>
    <path d="M200 0v500M400 0v500M600 0v500"/>
  </g>

  <text x="40" y="60" font-family="sans-serif" font-size="26" font-weight="600" fill="#e8eef5">
    Quarterly report
  </text>
  <text x="40" y="88" font-family="sans-serif" font-size="15" fill="#8fa3b8">
    Revenue by region
  </text>

  <!-- DIFFERENCE 1: amber instead of blue. -->
  <circle cx="150" cy="200" r="52" fill="#f0b429"/>

  <!-- DIFFERENCE 2: shifted 14px right and 9px down. -->
  <rect x="284" y="169" width="70" height="70" rx="6" fill="#4ec9a0"/>

  <!-- DIFFERENCE 3: the third bar is 55px taller. -->
  <g fill="#5a6b7d">
    <rect x="430" y="300" width="42" height="120"/>
    <rect x="490" y="260" width="42" height="160"/>
    <rect x="550" y="275" width="42" height="145"/>
    <rect x="610" y="240" width="42" height="180"/>
    <rect x="670" y="290" width="42" height="130"/>
  </g>
  <path d="M420 420h310" stroke="#8fa3b8" stroke-width="2" fill="none"/>

  <!-- DIFFERENCE 4: a star that is absent from the before image. -->
  <path d="M320 430l7.6 15.4 17 2.5-12.3 12 2.9 16.9-15.2-8-15.2 8 2.9-16.9-12.3-12 17-2.5z"
        fill="#f0655d"/>

  <text x="40" y="450" font-family="sans-serif" font-size="13" fill="#6b7f94">
    Figure 1 — regional breakdown
  </text>
</svg>
